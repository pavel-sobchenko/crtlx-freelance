<form class="w-1/2" [formGroup]="form" (ngSubmit)="update()">
  <p class="text-blue-600 font-bold my-4">General</p>

  <image-upload label="Avatar" formControlName="avatar" [accept]="accept" />

  <label appFormLabel for="name">Name</label>
  <input
    appFormInput
    formControlName="name"
    id="name"
    placeholder="Name"
    type="text"
  />
  @if (form.controls['name'].touched && form.invalid) {
    <validation-message [errors]="form.controls['name'].errors" />
  }

  <label appFormLabel for="email">Email</label>
  <input
    appFormInput
    formControlName="email"
    id="email"
    placeholder="Email"
    type="email"
    readonly
  />

  <ng-container formGroupName="address">
    <p class="text-blue-600 font-bold mt-8">Address</p>
    <label appFormLabel for="street">Street Address</label>
    <input
      appFormInput
      formControlName="street"
      id="street"
      placeholder="Street Address"
      type="text"
    />
    @if (form.get('address.street').touched && form.invalid) {
      <validation-message [errors]="form.get('address.street').errors" />
    }
    <div class="grid grid-cols-3 gap-2">
      <div>
        <label appFormLabel for="city">City</label>
        <input
          appFormInput
          formControlName="city"
          id="city"
          placeholder="City"
          type="text"
        />
        @if (form.get('address.city').touched) {
          <validation-message [errors]="form.get('address.city').errors" />
        }
      </div>
      <div>
        <label appFormLabel for="postCode">Postal Code</label>
        <input
          appFormInput
          formControlName="postCode"
          id="postCode"
          placeholder="Post Code"
          type="text"
        />
        @if (form.get('address.postCode').touched) {
          <validation-message [errors]="form.get('address.postCode').errors" />
        }
      </div>
      <div>
        <label for="countries" appFormLabel>Country</label>
        <select id="countries" formControlName="country" appFormInput>
          <option disabled ngValue="">Select Country!</option>

          @for (country of countries; track country.id) {
            <option [ngValue]="country.id">
              {{ country.name }}
            </option>
          }
        </select>
        @if (form.get('address.country').touched) {
          <validation-message [errors]="form.get('address.country').errors" />
        }
      </div>
    </div>
  </ng-container>
  <div class="flex mt-2 justify-end">
    <button appButton type="submit">Save</button>
  </div>
</form>
